<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Управленческий интенсив</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: a course syllabus sheet. One reading column, a three-step rail on top,
   the program as a timetable, two price tickets styled identically so neither is pushed. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#141B2D; --muted:#586277; --line:#CDD4DF;
  --accent:#2E3DC4; --accent-ink:#FFFFFF; --accent-soft:#E2E5FA; --note:#F5E6B3; --note-ink:#3D3114;
  --display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1420; --surface:#171E2D; --ink:#E7EBF3; --muted:#9BA5B9; --line:#2B3447;
  --accent:#8C98FF; --accent-ink:#0F1420; --accent-soft:#222A52; --note:#3A321A; --note-ink:#F1E3B6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#171E2D; --ink:#E7EBF3; --muted:#9BA5B9; --line:#2B3447;
  --accent:#8C98FF; --accent-ink:#0F1420; --accent-soft:#222A52; --note:#3A321A; --note-ink:#F1E3B6; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--accent)}
[hidden]{display:none!important}
#profile-form{display:grid;gap:28px}
.mot{display:grid;gap:16px}
.mrow{display:grid;gap:6px;min-width:0}
.mlab{font-size:15px}
.scale7{display:flex;gap:4px}
.scale7 label{flex:1;position:relative;min-width:0}
.scale7 input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scale7 span{display:block;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 0;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.scale7 input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale7 input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted)}
.other-input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;width:100%;max-width:440px;box-sizing:border-box}
.qhint{font-size:13.5px;color:var(--muted);margin:-4px 0 4px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer;max-width:62ch}
.consent input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--surface)}
.lang button{border:0;background:none;padding:4px 10px;border-radius:4px;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.notice{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:28px}

ol.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0;margin:0 0 32px}
ol.steps li{border-top:3px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted);display:flex;gap:8px;min-width:0}
ol.steps li .n{font-family:var(--mono)}
ol.steps li[data-state="on"]{border-color:var(--accent);color:var(--ink);font-weight:500}
ol.steps li[data-state="done"]{border-color:var(--ink);color:var(--ink)}

h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,38px);line-height:1.12}
h2{font-size:clamp(19px,3.4vw,23px);line-height:1.2}
.lede{color:var(--muted);max-width:62ch;margin:12px 0 0}
section.step{display:grid;gap:28px}

fieldset{border:0;padding:0;margin:0;display:grid;gap:10px;min-width:0}
legend{font-weight:600;margin-bottom:10px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px}
.chip input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:var(--r);font-weight:500;cursor:pointer;text-decoration:none;font-size:15px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.hint{font-size:13.5px;color:var(--muted)}

.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:14px}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sheet h3{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}
table.tt{width:100%;border-collapse:collapse;font-size:15px}
table.tt td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:top}
table.tt tr:last-child td{border-bottom:0}
table.tt td.w{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;width:1%;font-variant-numeric:tabular-nums}
table.tt tr.ai td{background:var(--accent-soft)}
.ailine{display:block;margin-top:6px;font-size:13.5px;line-height:1.45;background:var(--accent-soft);border-radius:4px;padding:4px 8px}
.ailine b{font-weight:600}
.tt-wrap{overflow-x:auto}

.roi{background:var(--note);color:var(--note-ink);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px}
.roi h2{font-size:19px}
.roi p{margin:0;max-width:64ch}
.roi .big{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.roi small{font-size:13px;opacity:.85}
.roi a{color:inherit}

.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ticket .kind{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ticket .name{font-weight:600;font-size:17px}
.ticket .price{font-family:var(--mono);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.ticket ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px;display:grid;gap:4px}
.ticket .btn{margin-top:auto}

.done{display:grid;gap:18px}
.code{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code output{font-family:var(--mono);font-size:20px;letter-spacing:.06em;background:var(--surface);border:1px dashed var(--line);padding:6px 12px;border-radius:var(--r)}
.preview{font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:12px}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ section.step{animation:in .25s ease-out} @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>

<div class="wrap">
  <header class="top">
    <div class="mark" data-t="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </header>
  <p class="notice" data-t="notice"></p>
  <p class="preview" id="preview" hidden></p>

  <ol class="steps">
    <li id="s1"><span class="n">1</span><span data-t="step1"></span></li>
    <li id="s2"><span class="n">2</span><span data-t="step2"></span></li>
    <li id="s3"><span class="n">3</span><span data-t="step3"></span></li>
  </ol>

  <!-- Step 1: profile -->
  <section class="step" id="view-profile">
    <div>
      <h1 data-t="pTitle"></h1>
      <p class="lede" data-t="pLede"></p>
    </div>
    <form id="profile-form" class="step" novalidate>
      <fieldset><legend data-t="qRole"></legend><div class="chips" id="role"></div></fieldset>
      <fieldset><legend data-t="qProg"></legend><p class="qhint" data-t="qProgHint"></p><div class="chips" id="prog"></div>
        <input type="text" id="prog-other" class="other-input" maxlength="80" autocomplete="off" hidden></fieldset>
      <fieldset><legend data-t="qIncome"></legend><div class="chips" id="income"></div></fieldset>
      <fieldset><legend data-t="qMot"></legend><p class="qhint" data-t="qMotHint"></p>
        <div class="ends" aria-hidden="true"><span id="mot-lo"></span><span id="mot-hi"></span></div>
        <div class="mot" id="mot"></div></fieldset>
      <label class="consent"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <button class="btn" id="to-program" type="button" data-t="next"></button>
        <span class="hint" id="profile-hint" data-t="fillAll"></span>
      </div>
    </form>
  </section>

  <!-- Step 2: program and choice -->
  <section class="step" id="view-program" hidden>
    <div>
      <h1 data-t="progName"></h1>
      <p class="lede" data-t="progLede"></p>
      <div class="meta"><span data-t="m1"></span><span data-t="m2"></span><span data-t="m3"></span><span data-t="m4"></span></div>
    </div>

    <div class="sheet">
      <h3 data-t="ttTitle"></h3>
      <div class="tt-wrap"><table class="tt" id="tt"></table></div>
    </div>

    <div class="roi" id="roi" hidden>
      <h2 data-t="roiTitle"></h2>
      <p id="roi-fact"></p>
      <p class="big" id="roi-calc"></p>
      <small data-t="roiNote"></small>
    </div>

    <div>
      <h2 data-t="chooseTitle"></h2>
      <p class="lede" data-t="chooseLede"></p>
    </div>
    <div class="tickets">
      <div class="ticket">
        <div class="kind" data-t="vA"></div>
        <div class="name" data-t="vAname"></div>
        <div class="price" id="priceA"></div>
        <ul><li data-t="vAinc1"></li><li data-t="vAinc2"></li></ul>
        <button class="btn ghost" type="button" data-choice="basic" data-t="pick"></button>
      </div>
      <div class="ticket">
        <div class="kind" data-t="vB"></div>
        <div class="name" id="vB-name"></div>
        <div class="price" id="priceB"></div>
        <ul><li data-t="vAinc1"></li><li data-t="vAinc2"></li><li id="vB-inc3"></li><li data-t="vBinc4"></li></ul>
        <button class="btn ghost" type="button" data-choice="ai" data-t="pick"></button>
      </div>
    </div>
  </section>

  <!-- Step 3: hand-off to the survey -->
  <section class="step" id="view-done" hidden>
    <div class="done">
      <div>
        <h1 data-t="dTitle"></h1>
        <p class="lede" id="d-choice"></p>
      </div>
      <p class="lede" data-t="dLede"></p>
      <div><a class="btn" id="to-survey" target="_blank" rel="noopener" data-t="toSurvey"></a></div>
      <p class="hint" id="survey-missing" data-t="surveyMissing" hidden></p>
      <div>
        <div class="hint" data-t="codeLabel"></div>
        <div class="code"><output id="code"></output><button class="btn ghost" type="button" id="copy" data-t="copy"></button></div>
      </div>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

<script>
/* ===== Settings to fill before launch ===== */
const SURVEY = {
  // Paste the Google Forms pre-filled link for each language, exactly as Google gives it
  // (…/viewform?usp=pp_url&entry.123456789=TEST). The test value is replaced with the participant's code.
  ru: "https://docs.google.com/forms/d/e/1FAIpQLSeBoNAJ_8x39M7QsyhR9HPoNrpyjC9-7zfv_nYRTVLgichyTw/viewform?usp=pp_url&entry.1150187766=TEST",
  en: "https://docs.google.com/forms/d/e/1FAIpQLSf9vUEWYCC6bhbDEeGGy3ni-ydleaCNjGbMLhe63netUqVv4w/viewform?usp=pp_url&entry.1336579108=TEST",
  es: ""   // empty: Spanish speakers get the English form
};
/* Source for the T1 argument (PwC, 2025 Global AI Jobs Barometer, press release 3 June 2025) */
const PWC_URL = "https://www.pwc.com/gx/en/news-room/press-releases/2025/ai-linked-to-a-fourfold-increase-in-productivity-growth.html";

/* Experimental groups (randomised 1/3 each):
   control — program and prices only; the AI version is a separate AI block
   t1      — as control + ROI argument (PwC 2025) and a payback calculation
   uoai    — same AI topics, but built into every session instead of a separate block (depth of AI integration) */
const GROUPS = ["control", "t1", "uoai"];
const GROUP_DIGIT = { control: "0", t1: "1", uoai: "2" };

const MONEY = {
  ru: { base:10000, ai:15000, fmt:n=>new Intl.NumberFormat("ru-RU").format(n)+" ₽" },
  en: { base:120, ai:180, fmt:n=>"$"+new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(n) },
  es: { base:120, ai:180, fmt:n=>"US$"+new Intl.NumberFormat("es-ES",{maximumFractionDigits:0}).format(n) }
};
/* monthly income midpoints for the payback line; 0 = no income */
const INCOME_MID = { ru:[35000,75000,150000,250000,0], en:[700,1750,3750,6500,0], es:[700,1750,3750,6500,0] };

const T = {
ru:{
 brand:"ФТМИ ИТМО · учебный эксперимент",

 step1:"Профиль", step2:"Программа", step3:"Анкета",

 qProg:"На какой программе или курсе по бизнесу и управлению вы сейчас учитесь?", qProgHint:"Можно выбрать несколько вариантов.",
 progs:["Короткий курс или интенсив","Программа повышения квалификации","Программа профессиональной переподготовки","MBA или Executive MBA","Магистратура по бизнесу или управлению","Бакалавриат по бизнесу или управлению","Другое","Сейчас не учусь"], progOtherPh:"Укажите программу",
 qMot:"Чего вы хотите достичь с помощью обучения бизнесу и управлению?", qMotHint:"Оцените каждый пункт от 1 до 7.", motLo:"1 = совсем не важно", motHi:"7 = очень важно",

/* ===== State ===== */
const KEY = "nirma-wtp-v5";
const OTHER = 6, NONE = 7;   /* indexes in the programme list */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function newId(){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  try{ const a=new Uint32Array(8); crypto.getRandomValues(a); a.forEach(x=>s+=abc[x%abc.length]); }
  catch(e){ for(let i=0;i<8;i++) s+=abc[Math.floor(Math.random()*abc.length)]; }
  return s.slice(0,4)+"-"+s.slice(4);
}
function randomGroup(){
  try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return GROUPS[a[0]%3]; }
  catch(e){ return GROUPS[Math.floor(Math.random()*3)]; }
}

/* hash tokens: language (ru/en/es), forced group (control/t1/uoai), reset */
const tokens = location.hash.slice(1).toLowerCase().split("-").filter(Boolean);
if (tokens.includes("reset")) {
  try{ localStorage.removeItem(KEY); }catch(e){}
  /* drop "reset" from the address so a reload keeps progress */
  try{ history.replaceState(null, "", location.pathname + location.search + "#" + tokens.filter(x=>x!=="reset").join("-")); }catch(e){}
}
let S = tokens.includes("reset") ? {} : load();
const forced = GROUPS.find(g=>tokens.includes(g)) || null;
if (!S.id) S.id = newId();
if (forced) S.group = forced;
else if (!GROUPS.includes(S.group)) S.group = randomGroup();
S.lang = ["ru","en","es"].find(l=>tokens.includes(l)) || S.lang || ((navigator.language||"ru").slice(0,2)==="es" ? "es" : (navigator.language||"ru").startsWith("ru") ? "ru" : "en");
S.profile = S.profile || {};
save();

/* ===== Render ===== */
const $ = id => document.getElementById(id);
const isU = () => S.group === "uoai";
function aiVersionName(t){ return isU() ? t.u_vBname : t.vBname; }
function chips(id, name, labels){
  const box = $(id); box.innerHTML = "";
  labels.forEach((lab,i)=>{
    const l = document.createElement("label"); l.className="chip";
    const inp = document.createElement("input"); inp.type="radio"; inp.name=name; inp.value=String(i); inp.id=name+"-"+i;
    if (String(S.profile[name])===String(i)) inp.checked = true;
    inp.addEventListener("change",()=>{ S.profile[name]=i; save(); checkProfile(); });
    const sp = document.createElement("span"); sp.textContent = lab;
    l.append(inp, sp); box.append(l);
  });
}
function progChips(labels){
  const box = $("prog"); box.innerHTML = "";
  labels.forEach((lab,i)=>{
    const l = document.createElement("label"); l.className="chip";
    const inp = document.createElement("input"); inp.type="checkbox"; inp.value=String(i); inp.id="prog-"+i;
    inp.addEventListener("change",()=>{
      let cur = new Set(S.profile.prog || []);
      if (inp.checked) { if (i===NONE) cur = new Set([NONE]); else { cur.delete(NONE); cur.add(i); } } else cur.delete(i);
      S.profile.prog = [...cur].sort((a,b)=>a-b); save(); syncProg(); checkProfile();
      if (i===OTHER && inp.checked) $("prog-other").focus();
    });
    const sp = document.createElement("span"); sp.textContent = lab;
    l.append(inp, sp); box.append(l);
  });
  syncProg();
}
function syncProg(){
  const sel = S.profile.prog || [];
  document.querySelectorAll("#prog input").forEach(x=>x.checked = sel.includes(+x.value));
  $("prog-other").hidden = !sel.includes(OTHER);
}
function motives(labels){
  const box = $("mot"); box.innerHTML = "";
  const cur = S.profile.mot || [];
  labels.forEach((lab,k)=>{
    const row = document.createElement("div"); row.className="mrow"; row.setAttribute("role","radiogroup"); row.setAttribute("aria-labelledby","mot-l-"+k);
    const lb = document.createElement("div"); lb.className="mlab"; lb.id="mot-l-"+k; lb.textContent = lab;
    const sc = document.createElement("div"); sc.className="scale7";
    for (let v=1; v<=7; v++){
      const l = document.createElement("label");
      const inp = document.createElement("input"); inp.type="radio"; inp.name="mot-"+k; inp.value=String(v); inp.id="mot-"+k+"-"+v;
      inp.setAttribute("aria-label", lab+": "+v);
      if (cur[k]===v) inp.checked = true;
      inp.addEventListener("change",()=>{ const m = (S.profile.mot || []).slice(); while (m.length<labels.length) m.push(null); m[k]=v; S.profile.mot=m; save(); checkProfile(); });
      const sp = document.createElement("span"); sp.textContent = String(v);
      l.append(inp, sp); sc.append(l);
    }
    row.append(lb, sc); box.append(row);
  });
}
/* first unanswered item in the order it appears on screen, or null */
function missing(){
  const p = S.profile, prog = p.prog || [], mot = p.mot || [];
  if (p.role===undefined) return "role";
  if (!prog.length) return "prog";
  if (prog.includes(OTHER) && !(p.progOther||"").trim()) return "prog-other";
  if (p.income===undefined) return "income";
  for (let k=0; k<8; k++) if (!mot[k]) return "mot-"+k;
  if (S.consent!==true) return "consent";
  return null;
}
function checkProfile(){
  const ok = missing()===null;
  $("to-program").setAttribute("aria-disabled", String(!ok)); $("profile-hint").hidden = ok;
}
function aiHeader(tb, title, only){
  const head=document.createElement("tr"); head.className="ai"; head.innerHTML=`<td class="w"></td><td><strong></strong> <span class="hint"></span></td>`;
  head.cells[0].textContent="AI"; head.querySelector("strong").textContent=title; head.querySelector(".hint").textContent="· "+only; tb.append(head);
}
function timetable(t){
  const tb = $("tt"); tb.innerHTML = "";
  t.tt.forEach(([w,topic],i)=>{
    const tr=document.createElement("tr"); tr.innerHTML=`<td class="w"></td><td></td>`; tr.cells[0].textContent=w; tr.cells[1].textContent=topic;
    if (isU()){ const s=document.createElement("span"); s.className="ailine"; const b=document.createElement("b"); b.textContent=t.u_aiPrefix+" "; s.append(b, document.createTextNode(t.u_ai[i])); tr.cells[1].append(s); }
    tb.append(tr);
  });
  if (isU()){
    aiHeader(tb, t.u_aiTitle, t.u_aiOnly);
    const [w,topic] = t.ai[3]; const tr=document.createElement("tr"); tr.className="ai"; tr.innerHTML=`<td class="w"></td><td></td>`; tr.cells[0].textContent=w; tr.cells[1].textContent=topic; tb.append(tr);
  } else {
    aiHeader(tb, t.aiTitle, t.aiOnly);
    t.ai.forEach(([w,topic])=>{ const tr=document.createElement("tr"); tr.className="ai"; tr.innerHTML=`<td class="w"></td><td></td>`; tr.cells[0].textContent=w; tr.cells[1].textContent=topic; tb.append(tr); });
  }
}
function roi(t){
  const show = S.group === "t1";
  $("roi").hidden = !show; if(!show) return;
  const m = MONEY[S.lang]; const extra = m.ai - m.base; const monthly = extra/12;
  const inc = INCOME_MID[S.lang][S.profile.income ?? 4] || 0;
  const pct = inc ? (monthly/inc*100) : null;
  const pctTxt = pct===null ? null : new Intl.NumberFormat(S.lang==="en"?"en-US":S.lang==="es"?"es-ES":"ru-RU",{maximumFractionDigits:1}).format(pct);
  $("roi-fact").innerHTML = t.roiFact(PWC_URL);
  $("roi-calc").textContent = t.roiCalc(m.fmt(extra), m.fmt(Math.ceil(monthly)), pctTxt);
}
/* One code goes to the form: ID-GC-lang-RI-MMMMMMMM-PPPPPPPP[~other programme]
   G = group (0 control, 1 ROI, 2 UOAI), C = choice (0 basic, 1 AI), R = role (0-3), I = income (0-4),
   M = 8 motive ratings 1-7 (Thompson & Gui, 2000), P = 8 programme flags 0/1 (AMBA & BGA, 2023) */
function surveyCode(){
  const p = S.profile, d = v => (v===undefined || v===null ? "x" : String(v));
  const mot = Array.from({length:8},(_,k)=>d((p.mot||[])[k])).join("");
  const prog = Array.from({length:8},(_,k)=>(p.prog||[]).includes(k) ? "1" : "0").join("");
  let code = [S.id, (GROUP_DIGIT[S.group]||"0")+(S.choice==="ai"?"1":S.choice==="basic"?"0":"x"), S.lang, d(p.role)+d(p.income), mot, prog].join("-");
  const other = (p.prog||[]).includes(OTHER) ? (p.progOther||"").replace(/[~\s]+/g," ").trim().slice(0,80) : "";
  if (other) code += "~" + other;
  return code;
}
function surveyLink(){
  const a = $("to-survey");
  const raw = SURVEY[S.lang] || (S.lang==="es" ? SURVEY.en : "");
  let u = null;
  try { u = raw ? new URL(raw) : null; } catch(e) { u = null; }
  if (!u) { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); $("survey-missing").hidden=false; return; }
  const key = [...u.searchParams.keys()].find(k=>k.startsWith("entry."));
  if (key) u.searchParams.set(key, surveyCode());
  a.href = u.toString(); a.removeAttribute("aria-disabled"); $("survey-missing").hidden=true;
}
function view(){
  const step = S.choice ? 3 : S.atProgram ? 2 : 1;
  $("view-profile").hidden = step!==1; $("view-program").hidden = step!==2; $("view-done").hidden = step!==3;
  ["s1","s2","s3"].forEach((id,i)=>$(id).dataset.state = i+1<step ? "done" : i+1===step ? "on" : "");
}
function render(){
  const t = T[S.lang]; document.documentElement.lang = S.lang;
  document.title = t.progName;
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=t[el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===S.lang)));
  chips("role","role",t.roles); progChips(t.progs); chips("income","income",t.incomes); motives(t.mots);
  $("prog-other").placeholder = t.progOtherPh; $("prog-other").value = S.profile.progOther || ""; $("mot-lo").textContent = t.motLo; $("mot-hi").textContent = t.motHi;
  $("consent").checked = S.consent===true; checkProfile();
  timetable(t); roi(t);
  $("vB-name").textContent = aiVersionName(t);
  $("vB-inc3").textContent = isU() ? t.u_vBinc3 : t.vBinc3;
  $("priceA").textContent = MONEY[S.lang].fmt(MONEY[S.lang].base);
  $("priceB").textContent = MONEY[S.lang].fmt(MONEY[S.lang].ai);
  if (S.choice) $("d-choice").textContent = t.chosen(S.choice==="ai" ? aiVersionName(t) : t.vAname);
  $("code").textContent = S.id;
  $("preview").hidden = !forced; if (forced) $("preview").textContent = t.preview({ t1:"T1 (ROI)", uoai:"T2 (UOAI)", control:"control" }[forced]);
  surveyLink(); view();
}

/* ===== Events ===== */
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
  S.lang = b.dataset.lang; save();
  const keep = tokens.filter(x=>GROUPS.includes(x));
  location.hash = [S.lang, ...keep].join("-");
  render();
}));
$("consent").addEventListener("change",e=>{ S.consent = e.target.checked; save(); checkProfile(); });
$("prog-other").addEventListener("input",e=>{ S.profile.progOther = e.target.value; save(); checkProfile(); });
function goProgram(e){
  if(e) e.preventDefault();
  const miss = missing();
  if (miss){
    const h=$("profile-hint"); h.hidden=false; h.style.color="var(--accent)"; h.style.fontWeight="600";
    const el = miss==="consent" ? $("consent") : miss==="prog-other" ? $("prog-other") : miss.startsWith("mot-") ? $(miss+"-1") : document.querySelector("#"+miss+" input");
    el.scrollIntoView({block:"center"}); el.focus(); return;
  }
  S.atProgram=true; save(); render(); window.scrollTo(0,0);
}
$("to-program").addEventListener("click", goProgram);
$("profile-form").addEventListener("submit", goProgram);
document.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>{
  if (S.choice) return;
  S.choice = b.dataset.choice; S.chosenAt = new Date().toISOString(); save(); render(); window.scrollTo(0,0);
}));
$("copy").addEventListener("click",()=>{
  const t=T[S.lang]; const done=()=>{ $("copy").textContent=t.copied; setTimeout(()=>$("copy").textContent=t.copy,1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(S.id).then(done,()=>selectCode());
  else selectCode();
});
function selectCode(){ const r=document.createRange(); r.selectNodeContents($("code")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
render();
</script>
